<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mute Button</title>
  <style>
    :root { color-scheme: dark; --accent: #F7C449; --red: #ff3524; }
    body { margin: 0; background: #151515; color: #ddd; font: 14px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #222; border-bottom: 1px solid #333; }
    #status { margin-left: auto; color: #888; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 14px; }
    #name { font-size: 16px; color: #aaa; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mute { width: 220px; height: 120px; border-radius: 18px; border: 2px solid #444; background: linear-gradient(#333, #1c1c1c); color: #eee; font: 700 28px -apple-system, Helvetica, sans-serif; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 18px #0008, inset 0 1px 0 #ffffff22; }
    #mute:active { transform: translateY(2px); box-shadow: 0 2px 8px #0008; }
    #mute.on { background: linear-gradient(#ff5a44, #b8160a); border-color: #ff8a7a; color: #fff; box-shadow: 0 0 24px #ff352488, inset 0 1px 0 #ffffff44; }
    #mute:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span>Mute Button</span>
    <div id="status">connecting...</div>
  </header>
  <main>
    <div id="name">No session</div>
    <button id="mute" disabled><span id="label">MUTE</span></button>
  </main>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
