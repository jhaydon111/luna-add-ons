<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Good Better Best</title>
  <style>
    :root { color-scheme: dark; --accent: #F7C449; --good: #7FB77E; --better: #6FA8DC; --best: #F7C449; --tier: #555; --gr: #FF8A3D; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #ddd; font: 13px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; user-select: none; }
    header { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; background: #1c1c1c; border-bottom: 1px solid #2c2c2c; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
    header h1 b:nth-child(1) { color: var(--good); } header h1 b:nth-child(2) { color: var(--better); } header h1 b:nth-child(3) { color: var(--best); }
    #status { margin-left: auto; color: #777; }
    #banner { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #2a2416; border-bottom: 1px solid #4a3d1c; color: #e8d9a8; }
    #banner[hidden] { display: none; }
    #banner span { flex: 1; }
    button { font: inherit; background: #262626; color: #ccc; border: 1px solid #3c3c3c; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    button.spark { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    button.small { padding: 2px 8px; font-size: 12px; }
    main { flex: 1; overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-left: 3px solid var(--tier); border-radius: 8px; padding: 10px 12px; transition: border-color .2s; }
    .card.good { --tier: var(--good); } .card.better { --tier: var(--better); } .card.best { --tier: var(--best); }
    .card.bypassed { --tier: #c0504d; }
    .card.bypassed .body { opacity: .45; }
    .top { display: flex; align-items: center; gap: 8px; }
    .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .inst { font: inherit; background: #262626; color: #ccc; border: 1px solid #3c3c3c; border-radius: 5px; padding: 3px 4px; }
    .seg { display: flex; }
    .seg button { border-radius: 0; margin-left: -1px; min-width: 58px; }
    .seg button:first-child { border-radius: 5px 0 0 5px; }
    .seg button:last-child { border-radius: 0 5px 5px 0; }
    .tier.good.on { background: var(--good); color: #000; }
    .tier.better.on { background: var(--better); color: #000; }
    .tier.best.on { background: var(--best); color: #000; }
    .tier.off.on { background: #333; color: #eee; }
    .tier.locked { color: #777; border-style: dashed; }
    .tier.busy { animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity: .35; } }
    .ab { min-width: 52px; }
    .ab.on { background: #c0504d; color: #fff; border-color: #c0504d; }

    .body { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; transition: opacity .2s; }
    .knobs { display: flex; justify-content: space-around; gap: 6px; }
    .knob { width: 104px; display: flex; flex-direction: column; align-items: center; cursor: ns-resize; outline: none; border-radius: 8px; padding: 4px 0 6px; touch-action: none; }
    .knob:hover, .knob:focus-visible, .knob.active { background: #222; }
    .knob svg { width: 64px; height: 64px; overflow: visible; }
    .knob .trk { fill: none; stroke: #333; stroke-width: 6; stroke-linecap: round; }
    .knob .val { fill: none; stroke: var(--tier); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tier) 60%, transparent)); }
    .knob .dot { fill: #fff; }
    .knob .pct { fill: #999; font: 600 12px Menlo, monospace; text-anchor: middle; }
    .knob .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
    .knob .word { font-size: 14px; font-weight: 600; color: var(--tier); min-height: 18px; }

    .knob .ringtrk { fill: none; stroke: #262626; stroke-width: 4; stroke-linecap: round; }
    .knob .ring { fill: none; stroke-width: 4; stroke-linecap: round; will-change: stroke-dasharray; }
    .knob .ring.gr { stroke: var(--gr); }
    .knob .ring.level { stroke: color-mix(in srgb, var(--tier) 70%, #fff); opacity: .8; }
    .knob.working .pct { fill: #ddd; }

    .blindbtn { white-space: nowrap; }
    .card.blind { --tier: #b48ef0; background: linear-gradient(180deg, #1d1826, #1a1a1a 60%); }
    .blind-tag { color: #b48ef0; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .letters { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
    .letter { width: 64px; height: 64px; border-radius: 50%; font: 700 24px -apple-system, Helvetica, sans-serif; color: #bbb; border: 2px solid #3c3c3c; background: #202020; }
    .letter.heard { border-color: #5d4d7a; color: #ddd; }
    .letter.on { background: #b48ef0; border-color: #b48ef0; color: #000; box-shadow: 0 0 16px #b48ef088; }
    .letter.busy { animation: pulse .5s infinite alternate; border-color: #b48ef0; }
    .blind-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #bbb; }
    .blind-foot span { flex: 1; }
    .reveal { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .rrow { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 6px; background: #202020; font-size: 12px; color: #999; border-left: 3px solid #555; }
    .rrow b { font-size: 15px; color: #ddd; width: 14px; }
    .rrow .rtier { font-weight: 600; width: 50px; color: #ddd; }
    .rrow .rchain { flex: 1; }
    .rrow.good { border-left-color: var(--good); } .rrow.better { border-left-color: var(--better); } .rrow.best { border-left-color: var(--best); }
    .rrow.picked { background: #2a2338; color: #ccc; }
    .rrow .star { color: #b48ef0; font-weight: 600; }
    button.keep { background: #b48ef0; color: #000; border-color: #b48ef0; font-weight: 600; }
    .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; color: #777; }
    .chain .src { margin-right: 4px; }
    .chip { padding: 2px 7px; border: 1px solid #333; border-radius: 10px; color: #aaa; transition: all .15s; }
    .chip.verb { border-style: dashed; }
    .chip.lit { border-color: var(--tier); color: #000; background: var(--tier); }
    .arrow { color: #555; }
    .nudge { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c9b98a; background: #221e12; border-radius: 6px; padding: 6px 8px; }
    .nudge span { flex: 1; }
    .detail { margin-top: 6px; color: #888; font-size: 12px; }
    .detail.warn { color: #e0a060; }
    .detail.locked-note { color: #e8d9a8; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1><b>Good</b> · <b>Better</b> · <b>Best</b></h1>
    <div id="status">connecting…</div>
  </header>
  <div id="banner" hidden><span id="banner-text"></span><button id="spark" class="spark">Get with Spark</button></div>
  <main id="tracks"></main>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
