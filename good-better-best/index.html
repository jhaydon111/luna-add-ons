<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Good Better Best</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0e10; --panel: #18181b; --panel2: #1f1f23; --line: #2b2b31; --text: #ddd; --dim: #8a8a92;
      --accent: #F7C449; --good: #7FB77E; --better: #6FA8DC; --best: #F7C449; --tier: #4a4a52;
      --gr: #FF8A3D; --blind: #b48ef0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 12px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; user-select: none; }
    header { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; background: linear-gradient(#1d1d21, #161619); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .04em; }
    header h1 b:nth-child(1) { color: var(--good); } header h1 b:nth-child(2) { color: var(--better); } header h1 b:nth-child(3) { color: var(--best); }
    #status { margin-left: auto; color: var(--dim); }
    #banner { display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: #2a2416; border-bottom: 1px solid #4a3d1c; color: #e8d9a8; }
    #banner[hidden] { display: none; }
    #banner span { flex: 1; }
    button { font: inherit; background: #26262b; color: #ccc; border: 1px solid #3a3a42; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    button.spark { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    button.small { padding: 2px 8px; font-size: 11px; }
    select { font: inherit; background: #26262b; color: #ccc; border: 1px solid #3a3a42; border-radius: 5px; padding: 3px 4px; width: 100%; }

    /* The console: strips side by side, scrolling sideways. */
    main { flex: 1; overflow: auto; padding: 12px; display: flex; gap: 8px; align-items: stretch; }
    .strip { width: 156px; flex: none; display: flex; flex-direction: column; gap: 7px; padding: 0 8px 10px; background: linear-gradient(var(--panel2), var(--panel) 40%); border: 1px solid var(--line); border-radius: 9px; position: relative; overflow: hidden; }
    .strip > * { flex-shrink: 0; }
    .strip::before { content: ''; display: block; height: 4px; margin: 0 -8px; background: var(--tier); box-shadow: 0 0 12px color-mix(in srgb, var(--tier) 70%, transparent); }
    .strip.good { --tier: var(--good); } .strip.better { --tier: var(--better); } .strip.best { --tier: var(--best); }
    .strip.bypassed { --tier: #c0504d; }
    .strip.bypassed .proc, .strip.bypassed .chain { opacity: .4; }
    .head { display: flex; flex-direction: column; gap: 5px; }
    .name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inst { font-size: 11px; color: var(--dim); }

    .tiersel { font-weight: 700; font-size: 12px; padding: 5px; border-width: 1px; }
    .tiersel.good { background: var(--good); color: #000; border-color: var(--good); }
    .tiersel.better { background: var(--better); color: #000; border-color: var(--better); }
    .tiersel.best { background: var(--best); color: #000; border-color: var(--best); }
    .tiersel.off { color: var(--dim); }

    .chain { display: flex; flex-wrap: wrap; gap: 3px; font-size: 10px; }
    .chip { padding: 1px 5px; max-width: 100%; border: 1px solid #34343b; border-radius: 4px; color: #b5b5bc; background: #141417; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all .15s; }
    .chip.verb { border-style: dashed; color: #8e8e96; }
    .chip.verb::before { content: '↪ '; color: #666; }
    .chip.lit { border-color: var(--tier); color: #000; background: var(--tier); }
    .chip.lit::before { color: #000; }

    /* EQ graphic. */
    .eq { position: relative; height: 70px; background: radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--tier) 14%, #121215), #0f0f12 70%); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .eq svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .eq .g { stroke: #24242a; stroke-width: .6; vector-effect: non-scaling-stroke; }
    .eq .zero { stroke: #3a3a42; stroke-width: .8; vector-effect: non-scaling-stroke; }
    .eq .fill { fill: color-mix(in srgb, var(--tier) 22%, transparent); }
    .eq .curve { fill: none; stroke: var(--tier); stroke-width: 1.8; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tier) 70%, transparent)); }
    .eq .band { cursor: grab; }
    .eq .band circle { fill: #18181c; stroke: var(--tier); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
    .eq .band text { fill: #ddd; font: 700 7px Menlo, monospace; text-anchor: middle; pointer-events: none; }
    .eq .band:hover circle, .eq .band.active circle { fill: var(--tier); }
    .eq .band:hover text, .eq .band.active text { fill: #000; }
    .eqlabel { position: absolute; left: 5px; top: 3px; font-size: 8.5px; font-weight: 700; color: var(--dim); letter-spacing: .08em; pointer-events: none; }
    .eqtip { position: absolute; right: 5px; top: 3px; font: 600 8.5px Menlo, monospace; color: #ddd; pointer-events: none; }
    .note { font-size: 11px; color: var(--dim); line-height: 1.35; display: flex; flex-direction: column; gap: 5px; padding: 6px; background: #141417; border-radius: 5px; }
    .note.warn { color: #e0a060; }
    .note.locked, .note.nudge { color: #e8d9a8; background: #221e12; }

    /* Processing: the macro knobs, one row each. */
    .proc { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 40px; transition: opacity .2s; }
    .proc.empty { min-height: 0; border: 0; padding: 0; }
    .krow { display: flex; align-items: center; gap: 6px; border-radius: 6px; padding: 1px 2px; }
    .krow:hover { background: #232328; }
    .knob { width: 52px; height: 52px; flex: none; cursor: ns-resize; outline: none; border-radius: 50%; touch-action: none; }
    .knob:focus-visible { box-shadow: 0 0 0 2px var(--tier); }
    .knob svg { width: 52px; height: 52px; overflow: visible; }
    .knob .trk { fill: none; stroke: #2e2e34; stroke-width: 6; stroke-linecap: round; }
    .knob .val { fill: none; stroke: var(--tier); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tier) 60%, transparent)); }
    .knob .dot { fill: #fff; }
    .knob .pct { fill: #9a9aa2; font: 600 12px Menlo, monospace; text-anchor: middle; }
    .knob .ringtrk { fill: none; stroke: #232327; stroke-width: 4; stroke-linecap: round; }
    .knob .ring { fill: none; stroke-width: 4; stroke-linecap: round; will-change: stroke-dasharray; }
    .knob .ring.gr { stroke: var(--gr); }
    .knob .ring.level { stroke: color-mix(in srgb, var(--tier) 70%, #fff); opacity: .8; }
    .ktext { min-width: 0; }
    .ktext .label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
    .ktext .word { font-size: 13px; font-weight: 700; color: var(--tier); }

    .tools { display: flex; gap: 5px; }
    .tools button { flex: 1; }
    .ab.on { background: #c0504d; color: #fff; border-color: #c0504d; }
    .blindbtn { color: var(--blind); }

    /* Fader section: GR meters, fader, level meter. Bars move by transform only (docs/DRAWING.md). */
    .faderrow { display: flex; gap: 6px; align-items: stretch; justify-content: center; height: 200px; margin-top: auto; padding: 8px 6px 6px; background: #111113; border: 1px solid var(--line); border-radius: 7px; }
    .bar { position: relative; width: 8px; background: #222226; border-radius: 2px; overflow: hidden; }
    .bar i, .bar u, .bar .peak { position: absolute; inset: 0; will-change: transform; }
    .bar i { overflow: hidden; transform: translateY(100%); }
    .bar u { transform: translateY(-100%); }
    .bar.level u { background: linear-gradient(to top, #3fae5a 0 70%, #e6c25a 70% 90%, #d44 90%); }
    .bar.level .peak { transform: translateY(100%); }
    .bar.level .peak::after { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: #eee; }
    .bar.gr i { transform: translateY(-100%); }
    .bar.gr u { transform: translateY(100%); background: linear-gradient(to bottom, #ffb46b, var(--gr) 50%, #e8452c); }
    .bar.gr { background: repeating-linear-gradient(to bottom, #222226 0 calc(25% - 1px), #34343a calc(25% - 1px) 25%); }
    .grbox { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .grlabel { font-size: 9px; font-weight: 700; color: var(--gr); letter-spacing: .08em; }
    .grbars { flex: 1; display: flex; gap: 4px; }
    .grcol { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .grcol .bar { flex: 1; }
    .grname { font-size: 8.5px; color: var(--dim); writing-mode: vertical-rl; transform: rotate(180deg); max-height: 40px; overflow: hidden; }
    .fwrap { display: flex; justify-content: center; }
    .fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 100%; margin: 0; background: transparent; accent-color: var(--tier); cursor: ns-resize; }
    .db { text-align: center; font: 600 11px Menlo, monospace; color: #aaa; min-height: 1.2em; }
    .ms { display: flex; gap: 5px; justify-content: center; }
    .ms button { width: 34px; font-weight: 700; font-size: 11px; padding: 3px 0; }
    .ms .mute.on { background: #8a2b2b; border-color: #d44; color: #fff; }
    .ms .solo.on { background: #8a7a1f; border-color: #dc3; color: #fff; }

    /* Blind test. */
    .strip.blind { --tier: var(--blind); background: linear-gradient(#211b2c, var(--panel) 50%); }
    .blind-tag { color: var(--blind); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .blindbody { display: flex; flex-direction: column; gap: 8px; }
    .letters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; justify-items: center; padding: 6px 0; }
    .letter { width: 54px; height: 54px; border-radius: 50%; font: 700 22px -apple-system, Helvetica, sans-serif; color: #bbb; border: 2px solid #3c3c44; background: #202024; }
    .letter.heard { border-color: #5d4d7a; color: #ddd; }
    .letter.on { background: var(--blind); border-color: var(--blind); color: #000; box-shadow: 0 0 16px #b48ef088; }
    .letter.busy { animation: pulse .5s infinite alternate; border-color: var(--blind); }
    @keyframes pulse { to { opacity: .35; } }
    .hint { font-size: 11px; color: #bbb; line-height: 1.35; }
    button.keep { background: var(--blind); color: #000; border-color: var(--blind); font-weight: 700; }
    .rrow { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 5px; background: #202024; color: #aaa; border-left: 3px solid #555; }
    .rrow b { font-size: 14px; color: #ddd; width: 12px; }
    .rrow .rtier { flex: 1; font-weight: 600; color: #ddd; }
    .rrow.good { border-left-color: var(--good); } .rrow.better { border-left-color: var(--better); } .rrow.best { border-left-color: var(--best); }
    .rrow.picked { background: #2a2338; }
    .rrow .star { color: var(--blind); }
  </style>
</head>
<body>
  <header>
    <h1><b>Good</b> · <b>Better</b> · <b>Best</b></h1>
    <div id="status">connecting…</div>
  </header>
  <div id="banner" hidden><span id="banner-text"></span><button id="spark" class="spark">Get with Spark</button></div>
  <main id="tracks"></main>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
